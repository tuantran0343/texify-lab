name: Varify Secret Run
on:

  workflow_call:
    inputs:
        title:
            type: string
            required: true

jobs:
    
  void-run:
    runs-on: ubuntu-latest
    environment: dev
    steps:

      - name: Log title
        run: |
            echo Has Title = '${{ inputs.title }}'
            echo Has DEV_SERVICE_NAME = '${{ secrets.SERVICE_NAME }}'
            echo Has REPOSITORY_SLACK_API = '${{ secrets.SLACK_API }}'