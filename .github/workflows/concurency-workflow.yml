name: Concurrency Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
        group: ${{ github.ref }}
        cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Run console
        run: |
            echo "Workflow started for ref = [${{ github.ref }}] , sha = [${{ github.sha }}]..."
            echo "Waiting Stage_1 for 2 minutes (120 seconds) to simulate a long task..."
            
            sleep 120
            
            echo "CONCURRENCY WORKFLOW HAS BEEN RUNNED ref = [${{ github.ref }}] , sha = [${{ github.sha }}]"
